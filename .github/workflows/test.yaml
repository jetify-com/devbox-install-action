name: test
# Runs the Devbox installer tests

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test-action:
    strategy:
      matrix:
        os: [macos-14, macos-15, macos-latest, ubuntu-latest]
        enable-cache: ['true', 'false']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install devbox
        uses: ./
        with:
          project-path: 'testdata'
          enable-cache: ${{ matrix.enable-cache }}
          disable-nix-access-token: "${{ github.ref != 'refs/heads/main' }}"

  test-action-with-devbox-version:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        enable-cache: ['true', 'false']
    steps:
      - uses: actions/checkout@v4
      - name: Install devbox
        uses: ./
        with:
          devbox-version: 0.13.6
          project-path: 'testdata'
          enable-cache: ${{ matrix.enable-cache }}
          disable-nix-access-token: "${{ github.ref != 'refs/heads/main' }}"

  test-action-with-sha256-checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install devbox
        uses: ./
        with:
          devbox-version: 0.13.6
          refresh-cli: true
          project-path: 'testdata'
          sha256-checksum: '22a31081df183aab7b8f88a794505c7c0ae217d6314e61b3e0bfe6972b992199'
          disable-nix-access-token: "${{ github.ref != 'refs/heads/main' }}"

  test-action-with-sha256-checksum-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install devbox
        id: install-devbox
        uses: ./
        continue-on-error: true
        with:
          devbox-version: 0.13.6
          refresh-cli: true
          sha256-checksum: 'bad-sha'
          project-path: 'testdata'
          disable-nix-access-token: "${{ github.ref != 'refs/heads/main' }}"
      - name: Fail on success
        if: steps.install-devbox.outcome == 'success'
        run: echo "The SHA check should have failed!" && exit 1

  test-action-with-sha256-checksum-on-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install devbox
        uses: ./
        with:
          devbox-version: 0.13.6
          refresh-cli: true
          sha256-checksum: '169836de22c41a1c68ac5a43e0514d4021137647c7c08ee8bd921faa430ee286'
          project-path: 'testdata'
          disable-nix-access-token: "${{ github.ref != 'refs/heads/main' }}"

  test-action-with-extra-nix-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install devbox with extra nix config "user-agent-suffix = test-suffix"
        uses: ./
        with:
          devbox-version: 0.13.6
          project-path: 'testdata'
          extra-nix-config: user-agent-suffix = test-suffix
      - name: Check nix user-agent-suffix config
        run: |
          [[ "$(nix config show user-agent-suffix)" == "test-suffix" ]]

  test-nix-versions:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        nix-version: [2.18.0, 2.19.2, 2.24.7, 2.30.2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install devbox with specific Nix version
        uses: ./
        with:
          project-path: 'testdata'
          nix-package-url: https://releases.nixos.org/nix/nix-${{ matrix.nix-version }}/nix-${{ matrix.nix-version }}-${{ runner.arch == 'X64' && 'x86_64' || 'aarch64' }}-${{ runner.os == 'macOS' && 'darwin' || 'linux' }}.tar.xz
          disable-nix-access-token: "${{ github.ref != 'refs/heads/main' }}"
      - name: Verify Nix version and run devbox commands
        run: |
          echo "::group::Nix version"
          nix --version
          installed_version=$(nix --version | awk '{print $3}')
          expected_version="${{ matrix.nix-version }}"
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "ERROR: Expected Nix version $expected_version, but got $installed_version"
            exit 1
          fi
          echo "::endgroup::"
          echo "::group::Contents of /etc/nix/nix.conf"
          cat /etc/nix/nix.conf || true
          echo "::endgroup::"
          echo "::group::Resolved Nix config"
          nix show-config --extra-experimental-features nix-command || true
          echo "::endgroup::"
          echo "::group::Run devbox commands"
          devbox run -- echo "Hello from devbox!"
          echo "::endgroup::"
